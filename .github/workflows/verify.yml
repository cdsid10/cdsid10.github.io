name: Verify Pull Request

# Validation only: type-check, build and check the generated route pages. This workflow never deploys:
# it has read-only permissions, no Pages steps and no environment. Deployment stays in deploy.yml (push to main).
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Verify generated 404.html and route pages
        run: node scripts/verify-routes.mjs dist
